substitutions:
  _SERVICE: render-generator

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/$_SERVICE:$BUILD_ID
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/$_SERVICE:$BUILD_ID

images:
  - gcr.io/$PROJECT_ID/$_SERVICE:$BUILD_ID
