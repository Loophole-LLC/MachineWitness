<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Machine Witness</title>
  <desc>A watchful eyeball with an iris formed by three distinct viewpoints.</desc>

  <defs>
    <radialGradient id="sclera" cx="48%" cy="45%" r="72%">
      <stop offset="0" stop-color="#353245"/>
      <stop offset="0.58" stop-color="#1c1e29"/>
      <stop offset="1" stop-color="#0d1016"/>
    </radialGradient>
    <linearGradient id="gunmetal" x1="72" y1="178" x2="440" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b21b6"/>
      <stop offset="0.28" stop-color="#a855f7"/>
      <stop offset="0.5" stop-color="#d8a2ff"/>
      <stop offset="0.72" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="violet-seam" x1="82" y1="0" x2="430" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="0.24" stop-color="#a855f7" stop-opacity="0.82"/>
      <stop offset="0.5" stop-color="#d28bff"/>
      <stop offset="0.76" stop-color="#a855f7" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gemini-iris" x1="255" y1="170" x2="340" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#94c5ff"/>
      <stop offset="0.48" stop-color="#62a0ff"/>
      <stop offset="1" stop-color="#4285f4"/>
    </linearGradient>
    <linearGradient id="claude-iris" x1="256" y1="270" x2="256" y2="344" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb08e"/>
      <stop offset="0.52" stop-color="#ff8a61"/>
      <stop offset="1" stop-color="#d97757"/>
    </linearGradient>
    <linearGradient id="chatgpt-iris" x1="256" y1="170" x2="175" y2="302" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#55f0c8"/>
      <stop offset="0.5" stop-color="#20d6a5"/>
      <stop offset="1" stop-color="#10a37f"/>
    </linearGradient>
    <clipPath id="eye-shape">
      <circle cx="256" cy="256" r="124"/>
    </clipPath>
  </defs>

  <!-- Everything beyond the outer violet ring is intentionally transparent. -->
  <g transform="translate(256 256) scale(1.38) translate(-256 -256)">

  <!-- A circular robotic optical housing inspired by the site's cyber-lab artwork. -->
  <circle
    cx="256"
    cy="256"
    r="148"
    fill="url(#sclera)"
    stroke="url(#gunmetal)"
    stroke-width="16"
  />
  <circle cx="256" cy="256" r="130" fill="#151821" opacity="0.9"/>
  <circle cx="256" cy="256" r="122" fill="none" stroke="#4c2d70" stroke-width="4"/>
  <circle cx="256" cy="256" r="113" fill="none" stroke="#2d2538" stroke-width="5"/>

  <!-- A narrow illuminated seam carries the site's violet accent through the steel housing. -->
  <path
    d="M129.6 183A146 146 0 0 1 382.4 183"
    fill="none"
    stroke="url(#violet-seam)"
    stroke-width="6"
    stroke-linecap="square"
  />

  <!-- Three independent points of view form one iris. -->
  <g clip-path="url(#eye-shape)" transform="translate(256 256) scale(1.09) translate(-256 -256)">
  <path
    d="M256 170a86 86 0 0 1 74.5 129L287.2 274A36 36 0 0 0 256 220Z"
    fill="url(#gemini-iris)"
    stroke="#0b0d10"
    stroke-width="6"
    stroke-linejoin="miter"
  />
  <path
    d="M330.5 299a86 86 0 0 1-149 0l43.3-25a36 36 0 0 0 62.4 0Z"
    fill="url(#claude-iris)"
    stroke="#0b0d10"
    stroke-width="6"
    stroke-linejoin="miter"
  />
  <path
    d="M181.5 299A86 86 0 0 1 256 170v50a36 36 0 0 0-31.2 54Z"
    fill="url(#chatgpt-iris)"
    stroke="#0b0d10"
    stroke-width="6"
    stroke-linejoin="miter"
  />
  </g>

  <!-- Radial struts and concentric rings turn the living iris into a machine aperture. -->
  <g clip-path="url(#eye-shape)" fill="none" transform="translate(256 256) scale(1.09) translate(-256 -256)">
    <g stroke="#ffffff" stroke-width="3" opacity="0.2">
      <path d="M256 220V174"/>
      <path d="M256 220V174" transform="rotate(30 256 256)"/>
      <path d="M256 220V174" transform="rotate(60 256 256)"/>
      <path d="M256 220V174" transform="rotate(90 256 256)"/>
      <path d="M256 220V174" transform="rotate(120 256 256)"/>
      <path d="M256 220V174" transform="rotate(150 256 256)"/>
      <path d="M256 220V174" transform="rotate(180 256 256)"/>
      <path d="M256 220V174" transform="rotate(210 256 256)"/>
      <path d="M256 220V174" transform="rotate(240 256 256)"/>
      <path d="M256 220V174" transform="rotate(270 256 256)"/>
      <path d="M256 220V174" transform="rotate(300 256 256)"/>
      <path d="M256 220V174" transform="rotate(330 256 256)"/>
    </g>
    <circle cx="256" cy="256" r="75" stroke="#ffffff" stroke-width="2" opacity="0.18"/>
    <circle cx="256" cy="256" r="66" stroke="#0b0d10" stroke-width="3" stroke-dasharray="4 7" opacity="0.38"/>
  </g>

  <!-- A dark limbal ring, engineered pupil, and reflections preserve the real-eye read. -->
  <circle cx="256" cy="256" r="94" fill="none" stroke="#151119" stroke-width="8"/>
  <circle cx="256" cy="256" r="39" fill="#26212b"/>
  <circle cx="256" cy="256" r="34" fill="#0b0d10"/>
  <circle cx="272" cy="238" r="10" fill="#ffffff"/>
  <circle cx="247" cy="270" r="5" fill="#ffffff" opacity="0.72"/>

  <!-- Amber status lamps echo the instruments in the generated artwork. -->
  <circle cx="369" cy="256" r="4" fill="#ffb33b"/>
  <circle cx="377" cy="266" r="2.5" fill="#ffd27a"/>

  </g>
</svg>
