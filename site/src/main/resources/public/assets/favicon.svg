<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Machine Witness</title>
  <desc>A HAL-style camera lens whose iris is formed by six distinct viewpoints.</desc>

  <defs>
    <radialGradient id="sclera" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#15121a"/>
      <stop offset="0.62" stop-color="#0d0b11"/>
      <stop offset="1" stop-color="#050406"/>
    </radialGradient>
    <!-- The red bloom HAL's lens throws onto its own housing. -->
    <radialGradient id="hal-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0.60" stop-color="#ff2d1a" stop-opacity="0"/>
      <stop offset="0.80" stop-color="#ff2d1a" stop-opacity="0.42"/>
      <stop offset="0.93" stop-color="#8c1200" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff2d1a" stop-opacity="0"/>
    </radialGradient>
    <!-- The hot amber point at the centre of the fisheye: HAL's single defining feature. -->
    <radialGradient id="hal-core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fffdf2"/>
      <stop offset="0.3" stop-color="#ffe9a3"/>
      <stop offset="0.62" stop-color="#ffb02e"/>
      <stop offset="1" stop-color="#b85c00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lens-specular" x1="170" y1="186" x2="330" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gunmetal" x1="72" y1="178" x2="440" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a1222"/>
      <stop offset="0.22" stop-color="#4b2473"/>
      <stop offset="0.5" stop-color="#7c3fb8"/>
      <stop offset="0.78" stop-color="#4b2473"/>
      <stop offset="1" stop-color="#160f1d"/>
    </linearGradient>
    <!-- Darkens the outer half of each wedge so the centre point is the only real light source,
         the way HAL's lens falls off into its housing. -->
    <radialGradient id="iris-falloff" cx="50%" cy="50%" r="50%">
      <stop offset="0.3" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#000000" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.66"/>
    </radialGradient>
    <linearGradient id="violet-seam" x1="82" y1="0" x2="430" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff3b22" stop-opacity="0"/>
      <stop offset="0.26" stop-color="#ff3b22" stop-opacity="0.70"/>
      <stop offset="0.5" stop-color="#ff7a5c"/>
      <stop offset="0.74" stop-color="#ff3b22" stop-opacity="0.70"/>
      <stop offset="1" stop-color="#ff3b22" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gemini-iris" x1="256" y1="180" x2="320" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#94c5ff"/>
      <stop offset="0.48" stop-color="#62a0ff"/>
      <stop offset="1" stop-color="#4285f4"/>
    </linearGradient>
    <linearGradient id="claude-iris" x1="320" y1="214" x2="320" y2="298" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb08e"/>
      <stop offset="0.52" stop-color="#ff8a61"/>
      <stop offset="1" stop-color="#d97757"/>
    </linearGradient>
    <linearGradient id="chatgpt-iris" x1="320" y1="298" x2="256" y2="336" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#55f0c8"/>
      <stop offset="0.5" stop-color="#20d6a5"/>
      <stop offset="1" stop-color="#10a37f"/>
    </linearGradient>
    <linearGradient id="grok-iris" x1="256" y1="336" x2="192" y2="298" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="0.5" stop-color="#dde5ee"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="deepseek-iris" x1="192" y1="298" x2="192" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c4b1ff"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="mistral-iris" x1="192" y1="214" x2="256" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd978"/>
      <stop offset="0.5" stop-color="#f4c343"/>
      <stop offset="1" stop-color="#e8b32c"/>
    </linearGradient>
    <clipPath id="eye-shape">
      <circle cx="256" cy="256" r="124"/>
    </clipPath>
  </defs>

  <!-- Everything beyond the outer violet ring is intentionally transparent. -->
  <g transform="translate(256 256) scale(1.38) translate(-256 -256)">

  <!-- A circular robotic optical housing inspired by the site's cyber-lab artwork. -->
  <circle
    cx="256"
    cy="256"
    r="148"
    fill="url(#sclera)"
    stroke="url(#gunmetal)"
    stroke-width="16"
  />
  <circle cx="256" cy="256" r="130" fill="#0a0810" opacity="0.95"/>
  <circle cx="256" cy="256" r="122" fill="none" stroke="#2a1420" stroke-width="4"/>
  <circle cx="256" cy="256" r="134" fill="url(#hal-glow)"/>
  <circle cx="256" cy="256" r="113" fill="none" stroke="#1b1119" stroke-width="5"/>

  <!-- A narrow illuminated seam carries the site's violet accent through the steel housing. -->
  <path
    d="M129.6 183A146 146 0 0 1 382.4 183"
    fill="none"
    stroke="url(#violet-seam)"
    stroke-width="5"
    stroke-linecap="round"
    opacity="0.42"
  />

  <!-- Six independent points of view form one iris: one 60-degree wedge per model, in the same
       order and the same colors the site gives their tiles. Same annulus the three wedges used
       (outer r=86, inner r=36), so the pupil, limbal ring and housing are untouched. -->
  <g clip-path="url(#eye-shape)" transform="translate(256 256) scale(1.09) translate(-256 -256)">
  <path d="M256 170A86 86 0 0 1 330.5 213L287.2 238A36 36 0 0 0 256 220Z" fill="url(#gemini-iris)" stroke="#0b0d10" stroke-width="6" stroke-linejoin="miter"/>
  <path d="M330.5 213A86 86 0 0 1 330.5 299L287.2 274A36 36 0 0 0 287.2 238Z" fill="url(#claude-iris)" stroke="#0b0d10" stroke-width="6" stroke-linejoin="miter"/>
  <path d="M330.5 299A86 86 0 0 1 256 342L256 292A36 36 0 0 0 287.2 274Z" fill="url(#chatgpt-iris)" stroke="#0b0d10" stroke-width="6" stroke-linejoin="miter"/>
  <path d="M256 342A86 86 0 0 1 181.5 299L224.8 274A36 36 0 0 0 256 292Z" fill="url(#grok-iris)" stroke="#0b0d10" stroke-width="6" stroke-linejoin="miter"/>
  <path d="M181.5 299A86 86 0 0 1 181.5 213L224.8 238A36 36 0 0 0 224.8 274Z" fill="url(#deepseek-iris)" stroke="#0b0d10" stroke-width="6" stroke-linejoin="miter"/>
  <path d="M181.5 213A86 86 0 0 1 256 170L256 220A36 36 0 0 0 224.8 238Z" fill="url(#mistral-iris)" stroke="#0b0d10" stroke-width="6" stroke-linejoin="miter"/>
  <circle cx="256" cy="256" r="96" fill="url(#iris-falloff)"/>
  </g>

  <!-- Radial struts and concentric rings turn the living iris into a machine aperture. -->
  <g clip-path="url(#eye-shape)" fill="none" transform="translate(256 256) scale(1.09) translate(-256 -256)">
    <g stroke="#ffffff" stroke-width="3" opacity="0.2">
      <path d="M256 220V174"/>
      <path d="M256 220V174" transform="rotate(30 256 256)"/>
      <path d="M256 220V174" transform="rotate(60 256 256)"/>
      <path d="M256 220V174" transform="rotate(90 256 256)"/>
      <path d="M256 220V174" transform="rotate(120 256 256)"/>
      <path d="M256 220V174" transform="rotate(150 256 256)"/>
      <path d="M256 220V174" transform="rotate(180 256 256)"/>
      <path d="M256 220V174" transform="rotate(210 256 256)"/>
      <path d="M256 220V174" transform="rotate(240 256 256)"/>
      <path d="M256 220V174" transform="rotate(270 256 256)"/>
      <path d="M256 220V174" transform="rotate(300 256 256)"/>
      <path d="M256 220V174" transform="rotate(330 256 256)"/>
    </g>
    <circle cx="256" cy="256" r="75" stroke="#ffffff" stroke-width="2" opacity="0.18"/>
    <circle cx="256" cy="256" r="66" stroke="#0b0d10" stroke-width="3" stroke-dasharray="4 7" opacity="0.38"/>
  </g>

  <!-- A dark limbal ring and a black pupil holding one hot amber point - the HAL read. The
       off-centre white catchlights that used to sit here made it a cartoon eyeball; a lens has
       a specular arc across the glass instead, and its light source dead centre. -->
  <circle cx="256" cy="256" r="94" fill="none" stroke="#120d14" stroke-width="8"/>
  <circle cx="256" cy="256" r="39" fill="#17131c"/>
  <circle cx="256" cy="256" r="34" fill="#030204"/>
  <circle cx="256" cy="256" r="30" fill="url(#hal-core)" opacity="0.55"/>
  <circle cx="256" cy="256" r="11" fill="url(#hal-core)"/>
  <circle cx="256" cy="256" r="4.5" fill="#fffdf4"/>
  <path d="M168 232a92 92 0 0 1 60-56" fill="none" stroke="url(#lens-specular)" stroke-width="13" stroke-linecap="round"/>

  <!-- Amber status lamps echo the instruments in the generated artwork. -->
  <circle cx="369" cy="256" r="4" fill="#ff4a2e"/>
  <circle cx="377" cy="266" r="2.5" fill="#ff8f6b"/>

  </g>
</svg>
